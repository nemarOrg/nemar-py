name: Unit and integration tests

# Minimal CI matrix to stay within the org's GitHub Actions budget.
# Re-expand when billing allows: see commit message of this file's last edit.
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + types + tests + build (ubuntu, py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The version is a static constant (nemar.__version__) read by
        # setuptools at build time, so a shallow checkout is enough.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          # Install the optional [datalad] extra here so the DataLad
          # backend's real-import test runs in CI. The minimum-Python job
          # below stays lean (no extra) to prove the default install works
          # without datalad.
          pip install -e ".[datalad]" \
            ruff pyright pytest pytest-cov pytest-httpserver trustme hypothesis build
          sudo apt-get update && sudo apt-get install -y aria2
      - name: Lint
        run: ruff check
      - name: Type check
        run: pyright src/nemar
      - name: Tests (unit + property + integration + e2e + aria2)
        run: pytest --cov=nemar --cov-fail-under=94 -m "not live"
      - name: Build smoke
        run: |
          python -m build
          pip install dist/*.whl --force-reinstall
          python -c "import nemar; print(nemar.__version__)"
          nemar-py --help

  test-py-min:
    name: Tests on minimum supported Python (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e . pytest pytest-httpserver trustme hypothesis
      - run: pytest -m "not e2e and not aria2 and not live" -q
