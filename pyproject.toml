[project]
name = "nemar-py"
description = "A Python client for accessing NEMAR datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "NEMAR Organization" },
]
keywords = ["neuroscience", "bids", "eeg", "meg", "ieeg", "nemar", "dataset", "download"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25",
  "pydantic>=2",
  "tqdm",
  "typer>=0.12",
  "wcmatch>=10.1",
  # DataLad is the first-layer transfer backend (HTTPS is the fallback).
  # ``git-annex`` is the Haskell binary DataLad shells out to;
  # ``psychoinformatics-de`` ships it as a self-contained PyPI wheel
  # (linux / mac / windows). Pinning it here means
  # ``pip install nemar-py`` is enough — users no longer need to
  # ``brew install git-annex`` / ``apt install git-annex`` separately.
  "datalad>=0.19",
  "git-annex>=10",
  # Direct S3 transfer layer — anonymous public-read against
  # ``nemar.s3.us-east-2.amazonaws.com``. The wheel is pure-Python and
  # ``eegdash`` (which uses the same bucket) has been running this in
  # production for years, so the contract is well-exercised.
  "s3fs>=2024.1",
]
dynamic = ["version"]

[project.optional-dependencies]
# Kept as a no-op alias for back-compat: ``pip install nemar-py[datalad]``
# was the documented way to opt in before DataLad became a default
# dependency. The empty list means the extra installs nothing extra
# (the dep is already in ``[project.dependencies]``); existing pins
# and lockfiles keep resolving.
datalad = []

[project.urls]
Homepage = "https://github.com/nemarOrg/nemar-py"
Repository = "https://github.com/nemarOrg/nemar-py"
Issues = "https://github.com/nemarOrg/nemar-py/issues"
Changelog = "https://github.com/nemarOrg/nemar-py/releases"

[project.scripts]
nemar-py = "nemar._cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpserver>=1.1",
  "trustme>=1.1",
  "hypothesis>=6.100",
  "ruff>=0.14",
  "pyright>=1.1.380",
  # Mutation testing — full sweep over src/nemar/. Configured in
  # [tool.mutmut] below. Run with `uv run mutmut run`.
  "mutmut>=3.0",
  # Network-chaos fixtures for tests/integration/test_chaos.py.
  # Uses chaostoolkit-toxiproxy's functional helpers (create_proxy,
  # create_latency_toxic, create_limiter_toxic, …) directly. Also
  # requires the ``toxiproxy-server`` binary on PATH
  # (brew install toxiproxy) and ``NEMAR_CHAOS=1`` to actually run.
  "chaostoolkit-toxiproxy>=0.3",
  # In-memory S3 server for tests/integration/test_python_transfer.py
  # and tests/unit/test_s3.py. ``moto[s3]`` boots a botocore-compatible
  # endpoint so ``s3fs`` can talk to a real-shaped API without
  # touching AWS.
  "moto[s3,server]>=5",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/nemar"]

[tool.hatch.build.targets.wheel.shared-data]
"src/nemar/py.typed" = "nemar/py.typed"

[tool.pytest.ini_options]
addopts = ["--tb=short", "-ra", "-vv", "--strict-markers"]
markers = [
  "integration: uses the local HTTPS fixture server",
  "e2e: end-to-end (subprocess and/or real downloader)",
  "live: hits data.nemar.org; gated by NEMAR_LIVE_TEST=1",
  "slow: takes more than 2 seconds",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nemar"]
branch = true
omit = ["src/nemar/__main__.py"]

[tool.coverage.report]
fail_under = 94
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.pyright]
include = ["src/nemar"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I", "UP"]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mutmut]
# Modules with substantive logic (parsers, value types, retry loops). Excludes
# pure-declaration modules (_errors.py) and large transfer-side code where
# subprocess + network mocks dominate the runtime cost.
# Mutate the whole package directory. Mutmut 3.x copies only the
# explicitly-listed files into its sandbox, which breaks imports when
# any test depends on a submodule we did not list (and the package
# ``__init__.py`` needs to be there too). Pointing at the package
# itself sidesteps both issues; mutmut still skips trivially mutable
# spots and the unit suite (which runs fast) gates each mutant.
paths_to_mutate = ["src/nemar/"]
# mutmut 3.x expects a list of test directories (the 2.x colon-separated
# string form was iterated char-by-char in 3.5 and crashed pytest).
tests_dir = ["tests/unit", "tests/property"]
pytest_add_cli_args = [
  "-x",
  "-q",
  "--no-cov",
  "--no-header",
  "--ignore=tests/unit/test_cli_inproc.py",
  "--ignore=tests/unit/test_download_internals.py",
  "--ignore=tests/property/test_retry_jitter.py",
]
