[project]
name = "nemar-py"
description = "A Python client for accessing NEMAR datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "NEMAR Organization" },
]
keywords = ["neuroscience", "bids", "eeg", "meg", "ieeg"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
]
dependencies = [
  "httpx>=0.25",
  "pydantic>=2",
  "tqdm",
  "typer>=0.12",
  "wcmatch>=10.1",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/nemarOrg/nemar-py"

[project.scripts]
nemar-py = "nemar._cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpserver>=1.1",
  "trustme>=1.1",
  "hypothesis>=6.100",
  "ruff>=0.14",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/nemar"]

[tool.pytest.ini_options]
addopts = ["--tb=short", "-ra", "-vv"]

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I", "UP"]
ignore = [
  "D203",
  "D213",
]
