[project]
name = "nemar-py"
description = "A Python client for accessing NEMAR datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "NEMAR Organization" },
]
keywords = ["neuroscience", "bids", "eeg", "meg", "ieeg"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
]
dependencies = [
  "httpx>=0.25",
  "pydantic>=2",
  "tqdm",
  "typer>=0.12",
  "wcmatch>=10.1",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/nemarOrg/nemar-py"

[project.scripts]
nemar-py = "nemar._cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpserver>=1.1",
  "trustme>=1.1",
  "hypothesis>=6.100",
  "ruff>=0.14",
  "pyright>=1.1.380",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/nemar"]

[tool.pytest.ini_options]
addopts = ["--tb=short", "-ra", "-vv", "--strict-markers"]
markers = [
  "integration: uses the local HTTPS fixture server",
  "e2e: end-to-end (subprocess and/or real downloader)",
  "aria2: requires aria2c on PATH",
  "live: hits data.nemar.org; gated by NEMAR_LIVE_TEST=1",
  "slow: takes more than 2 seconds",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nemar"]
branch = true
omit = ["src/nemar/__main__.py"]

[tool.coverage.report]
fail_under = 94
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.pyright]
include = ["src/nemar"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I", "UP"]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mutmut]
paths_to_mutate = [
  "src/nemar/_bids.py",
  "src/nemar/_glob.py",
  "src/nemar/_models.py",
]
tests_dir = ["tests/unit", "tests/property"]
pytest_add_cli_args = [
  "-x",
  "-q",
  "--no-cov",
  "--no-header",
  "--ignore=tests/unit/test_cli_inproc.py",
  "--ignore=tests/unit/test_download_internals.py",
  "--ignore=tests/property/test_retry_jitter.py",
]
